services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: pulse
      POSTGRES_DB: pulse
    ports:
      - "5432:5432"
    volumes:
      - pulse-postgres-data:/var/lib/postgresql/data

  pulse:
    build: .
    depends_on:
      - postgres
    environment:
      PULSE_DB_DSN: postgres://pulse:pulse@postgres:5432/pulse?sslmode=disable
      PULSE_ADDR: ":8080"
    ports:
      - "8080:8080"

volumes:
  pulse-postgres-data:
